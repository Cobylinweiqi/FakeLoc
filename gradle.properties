org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

# AGP 8.7.3's "recommended maximum" compile SDK is 35, but libxposed requires 36.
# This is an advisory warning rather than a hard limit, so silence it.
android.suppressUnsupportedCompileSdk=36

# Fail loudly on a missing SDK component instead of letting AGP try to fetch it
# itself. Its downloader has no timeout worth the name, so a package it cannot
# reach stalls the build indefinitely with zero output. Install the component
# with sdkmanager instead.
android.builder.sdkDownload=false

kotlin.code.style=official

# ---------------------------------------------------------------------------
# Map keys: none are baked in at build time — on purpose
# ---------------------------------------------------------------------------
# This build carries no map credential of any kind. The one renderer it bundles,
# Tencent, is registered by the *user* in the app's own settings page, and the key
# is handed to the SDK at runtime (see `mapsdk/MapSdkBootstrap`).
#
# There is deliberately nothing to set here. A key is bound to one package name
# and one signing certificate, so a key committed to this repository would be
# useless to anyone who rebuilt it and a small leak for its owner. Shipping one
# also hides the failure it is meant to fix: a key that quietly stops working
# looks exactly like a working one until a request is made.
#
# The manifest has no map key entry either — Tencent takes its key per map view
# through `TencentMapOptions.setMapKey`. Until the user supplies one, the picker
# shows a plain "no key" panel rather than an empty grey square.

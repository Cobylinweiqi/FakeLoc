[versions]
agp = "8.7.3"
kotlin = "2.2.10"
coreKtx = "1.13.1"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.10.01"
materialIconsExtended = "1.7.5"

# Tencent Map (腾讯) — the only base map this build ships, since 2026-09-29.
# Baidu and Amap were dropped to get the APK under 10 MB; see the comment on the
# dependency in `app/build.gradle.kts`. The aar bundles the vector engine and its
# native libraries; the Key is passed per map view through
# TencentMapOptions.setMapKey().
#
# Pinned to the 5.9.0 line deliberately, and it must not be bumped blindly:
# measured 2026-09-29, every 6.x release on Maven Central (6.3.0, 6.13.0 —
# including the `.full` variants) ships a `classes.jar` whose public API is typed
# against `com.tencent.tencentmap.mapsdk.maps.model.LatLng` while omitting that
# very class, so `CameraUpdateFactory.newLatLngZoom` cannot be linked at all.
# 5.9.0 carries it (12.2 MB, vs 25 MB for the broken 6.13.0). Bumping this
# requires re-checking that the class is present.
tencentMap = "5.9.0"

junit = "4.13.2"
androidxJunit = "1.2.1"
espressoCore = "3.6.1"

# libxposed = the "new Xposed API" (API 101).
# `api` is compileOnly (provided by the framework at runtime).
# `service` is bundled so the manager UI can talk to LSPosed and read/write
# the module's remote preferences without root.
libxposed = "101.0.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "materialIconsExtended" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }

libxposed-api = { group = "io.github.libxposed", name = "api", version.ref = "libxposed" }
libxposed-service = { group = "io.github.libxposed", name = "service", version.ref = "libxposed" }

tencent-map-vector = { group = "com.tencent.map", name = "tencent-map-vector-sdk", version.ref = "tencentMap" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
